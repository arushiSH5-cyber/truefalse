name: Web app site

# Publishes the web app to GitHub Pages. With the repository variable TRUEFALSE_API_URL set
# (the hosted checker, e.g. on Render), it is the real app; without it, the saved-answers demo.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/demo.yml"]
  # (also run by hand after setting TRUEFALSE_API_URL)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The share target is a server route; a static site can't have one.
      - run: rm -rf app/share
      # Shared text and links arrive as ?title=&text=&url= on the home page (files need a server).
      - name: Static share target
        run: node -e 'const fs=require("fs"),f="public/manifest.webmanifest",m=JSON.parse(fs.readFileSync(f,"utf8"));m.share_target={action:"./",method:"GET",params:{title:"title",text:"text",url:"url"}};fs.writeFileSync(f,JSON.stringify(m,null,2))'
      - run: npx next build
        env:
          NEXT_PUBLIC_DEMO: ${{ vars.TRUEFALSE_API_URL == '' && '1' || '' }}
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_API_URL: ${{ vars.TRUEFALSE_API_URL }}
          NEXT_PUBLIC_BASE_PATH: /truefalse
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
