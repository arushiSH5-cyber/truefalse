name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: truefalse
          POSTGRES_PASSWORD: truefalse
          POSTGRES_DB: truefalse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truefalse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://truefalse:truefalse@localhost:5432/truefalse
      TEST_DATABASE_URL: postgresql+asyncpg://truefalse:truefalse@localhost:5432/truefalse
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (video/voice tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # media extra: real audio decoding and article extraction are tested too
      - run: uv sync --extra media
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app scripts
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Test (unit + Postgres integration)
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npx next build
