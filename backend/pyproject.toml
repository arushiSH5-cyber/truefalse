[project]
name = "truefalse"
version = "0.1.0"
description = "Multilingual, multimodal AI misinformation checker"
authors = [
    { name = "Arushi Nirmal" },
    { name = "Arpanjeet Singh" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "anthropic>=1.13",
    "python-telegram-bot>=21.6",
    "alembic>=1.13",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pillow>=10.4",
    "imagehash>=4.3",
]

[project.optional-dependencies]
# Heavy ML extras; install with `uv sync --extra ml`
ml = [
    "sentence-transformers>=3.0",
]
# Speech-to-text, public video/podcast download, article extraction; `uv sync --extra media`
media = [
    "faster-whisper>=1.0",
    "yt-dlp>=2024.8.6",
    "trafilatura>=1.12",
]

# Fast language-ID pre-check; `uv sync --extra lid` + a fastText model file (LID_MODEL_PATH)
lid = [
    "fasttext-wheel>=0.9.2",
]
# Voice replies; `uv sync --extra voice` (+ ffmpeg)
voice = [
    "gTTS>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres (DATABASE_URL); skipped otherwise",
    "ml: needs the ml extra (sentence-transformers + model download); skipped otherwise",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ASYNC240"]
